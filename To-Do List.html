<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef0; --paper:#fbfcfc; --ink:#1d2b33; --muted:#6a7b84; --line:#cfd9dd;
  --accent:#1f6f78; --accent-ink:#fff; --danger:#b3412f; --done:#9aa9b0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10181c; --paper:#182126; --ink:#e4ecef; --muted:#8fa0a8; --line:#2b3a41;
    --accent:#4fb5bf; --accent-ink:#0b1417; --danger:#e07a68; --done:#6a7b84;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10181c; --paper:#182126; --ink:#e4ecef; --muted:#8fa0a8; --line:#2b3a41;
  --accent:#4fb5bf; --accent-ink:#0b1417; --danger:#e07a68; --done:#6a7b84;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:40px 16px 64px}
h1{font:700 2.2rem/1.1 Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
form.add{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;
  border:1px solid var(--line);border-radius:6px;padding:10px 12px}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:1px solid var(--line);
  border-radius:6px;padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:is(button,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters button{border-color:transparent;color:var(--muted)}
.filters button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.text{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .text{color:var(--done);text-decoration:line-through}
li .edit{flex:1;min-width:0}
.acts{display:flex;gap:4px}
.acts button{padding:4px 8px;font-size:.85rem;color:var(--muted)}
.acts button[data-action=delete]:hover{color:var(--danger);border-color:var(--danger)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer button{font-size:.85rem;padding:4px 8px}
@media (prefers-reduced-motion:no-preference){li{animation:in .15s ease-out}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p class="sub">Saved in this browser. Double-click a task to rename it.</p>
  <div class="card">
    <form class="add" id="add-form" autocomplete="off">
      <input type="text" id="new-task" placeholder="What needs doing?" aria-label="New task" maxlength="200">
      <button class="primary" type="submit">Add task</button>
    </form>
    <div class="filters" id="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <ul id="list" aria-live="polite"></ul>
    <footer>
      <span id="count"></span>
      <button type="button" id="clear">Clear completed</button>
    </footer>
  </div>
</main>

<script>
(function () {
  var KEY = "todo-app:v1";
  var state = { tasks: [], filter: "all", editingId: null };

  // ---- Persistence (try/catch: storage can be unavailable) ----
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (Array.isArray(data.tasks)) state.tasks = data.tasks;
      if (["all", "active", "completed"].indexOf(data.filter) > -1) state.filter = data.filter;
    } catch (e) { /* start fresh */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ tasks: state.tasks, filter: state.filter })); }
    catch (e) { /* storage full or blocked */ }
  }

  // ---- State changes (CRUD) ----
  function addTask(text) {
    text = text.trim();
    if (!text) return;
    state.tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, done: false });
    commit();
  }
  function updateTask(id, patch) {
    state.tasks = state.tasks.map(function (t) { return t.id === id ? Object.assign({}, t, patch) : t; });
    commit();
  }
  function deleteTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    commit();
  }
  function commit() { save(); render(); }

  // ---- Rendering ----
  var $list = document.getElementById("list");
  var $count = document.getElementById("count");
  var $clear = document.getElementById("clear");

  function visible() {
    return state.tasks.filter(function (t) {
      return state.filter === "all" || (state.filter === "active" ? !t.done : t.done);
    });
  }

  function el(tag, props) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { n[k] = props[k]; });
    return n;
  }

  function taskNode(t) {
    var li = el("li", { className: t.done ? "done" : "" });
    li.dataset.id = t.id;
    var box = el("input", { type: "checkbox", checked: t.done });
    box.dataset.action = "toggle";
    box.setAttribute("aria-label", "Mark complete");
    li.appendChild(box);

    if (state.editingId === t.id) {
      var input = el("input", { type: "text", className: "edit", value: t.text, maxLength: 200 });
      input.dataset.action = "edit-field";
      input.setAttribute("aria-label", "Edit task");
      li.appendChild(input);
    } else {
      var span = el("span", { className: "text", textContent: t.text });
      span.dataset.action = "text";
      li.appendChild(span);
      var acts = el("div", { className: "acts" });
      var ed = el("button", { type: "button", textContent: "Edit" });
      ed.dataset.action = "edit";
      var del = el("button", { type: "button", textContent: "Delete" });
      del.dataset.action = "delete";
      acts.append(ed, del);
      li.appendChild(acts);
    }
    return li;
  }

  function render() {
    var items = visible();
    $list.replaceChildren();
    if (!items.length) {
      var msgs = { all: "No tasks yet. Add one above.", active: "Nothing left to do.", completed: "No completed tasks yet." };
      $list.appendChild(el("li", { className: "empty", textContent: msgs[state.filter] }));
    } else {
      items.forEach(function (t) { $list.appendChild(taskNode(t)); });
    }
    var left = state.tasks.filter(function (t) { return !t.done; }).length;
    $count.textContent = left + (left === 1 ? " task left" : " tasks left");
    $clear.hidden = !state.tasks.some(function (t) { return t.done; });
    document.querySelectorAll("#filters button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
    });
    var f = $list.querySelector(".edit");
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }

  // ---- Delegated events: one listener on the list handles every row ----
  function rowId(target) { var li = target.closest("li[data-id]"); return li && li.dataset.id; }

  $list.addEventListener("click", function (e) {
    var a = e.target.dataset.action, id = rowId(e.target);
    if (!id) return;
    if (a === "delete") deleteTask(id);
    else if (a === "edit") { state.editingId = id; render(); }
  });
  $list.addEventListener("change", function (e) {
    if (e.target.dataset.action === "toggle") updateTask(rowId(e.target), { done: e.target.checked });
  });
  $list.addEventListener("dblclick", function (e) {
    if (e.target.dataset.action === "text") { state.editingId = rowId(e.target); render(); }
  });
  $list.addEventListener("keydown", function (e) {
    if (e.target.dataset.action !== "edit-field") return;
    if (e.key === "Enter") finishEdit(e.target, true);
    else if (e.key === "Escape") finishEdit(e.target, false);
  });
  $list.addEventListener("focusout", function (e) {
    if (e.target.dataset.action === "edit-field" && state.editingId) finishEdit(e.target, true);
  });
  function finishEdit(input, saveIt) {
    var id = rowId(input);
    state.editingId = null;
    var text = input.value.trim();
    if (saveIt && text) updateTask(id, { text: text });
    else if (saveIt && !text) deleteTask(id);  // emptying a task removes it
    else render();
  }

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("new-task");
    addTask(input.value);
    input.value = "";
    input.focus();
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var f = e.target.dataset.filter;
    if (f) { state.filter = f; commit(); }
  });
  $clear.addEventListener("click", function () {
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    commit();
  });

  // Keep multiple tabs in sync
  window.addEventListener("storage", function (e) { if (e.key === KEY) { load(); render(); } });

  load();
  render();
})();
</script>
</body>
</html>
